# WHY: maturity flag is read by the kanon substrate registry so consumers can
# tell at a glance which API surfaces are pre-stabilization. Phase 0 lands
# the six-type value system, schema DDL, and expression-AST vocabulary
# (Decision 5, Decision 14); the full statement grammar (SELECT / INSERT /
# UPDATE / DELETE with joins, subqueries, window functions) is Phase 4.
[package.metadata.kanon]
maturity = "alpha"
since = "2026-08-15"
phase = "0"
phase-description = "six-type value system, schema DDL, and expression-AST vocabulary per Decision 5 and Decision 14"
exit-criteria = "Phase 1 pager adopts lexis::Value for on-disk row encoding; Phase 4 parser adopts lexis::ast for full statement grammar; see kanon/projects/pinax/ROADMAP.md"
