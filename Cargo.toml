[workspace]
resolver = "2"
members = [
    "crates/hypomnema",
    "crates/lexis",
    "crates/phylaxis",
    "crates/pinax",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-PolyForm-Shield-1.0.0"
homepage = "https://github.com/forkwright/pinax"
repository = "https://github.com/forkwright/pinax"
authors = ["forkwright"]

[workspace.dependencies]
# WHY: fleet-preferred small-string type for validated identifier newtypes
# (kanon RUST.md § Validation constructors canonical example).
compact_str = "0.9"
# WHY: property-based testing for the type system's validated constructors
# (kanon RUST.md § Testing).
proptest = "1"
# WHY: snafu is the fleet-wide error library per kanon RUST.md; pinned once
# here so every crate inherits via `workspace = true`. Internal cross-crate
# edges (lexis, hypomnema, phylaxis) are NOT listed here — they use direct
# `{ path = "...", version = "..." }` pins in the consuming crate's own
# manifest, matching kanon's own workspace convention, because that is what
# lets ARCHITECTURE/crate-index-conformance read real `path =` edges out of
# each crate's Cargo.toml and cross-check them against CRATE-INDEX.toml.
snafu = "0.8"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# WHY: warn not deny — tests legitimately use these; each library crate
# denies both at the crate root (`#![deny(clippy::unwrap_used, ...)]`) with
# a `#![cfg_attr(test, allow(...))]` escape, so tests keep the ergonomics
# and non-test library code stays at zero tolerance.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
# WHY: pedantic overrides — fleet baseline (kanon, heurema). Noise reduction,
# not a relaxation of the invariants the task conformance bar names: no `as`
# casts and no unwrap/expect are enforced by hand and by the crate-level
# deny above, not by these specific pedantic lints.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
must_use_unit = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
