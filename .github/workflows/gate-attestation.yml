name: Gate Attestation

on:
  pull_request:
    branches: [main]

# WHY: the reusable declares `contents: read` for its own job, but the caller
# controls the token the reusable receives. Declaring it here keeps the grant
# explicit at the boundary that actually decides it.
permissions:
  contents: read

# WHY: the reusable declares no concurrency group, so without this a rapid
# re-push leaves the superseded run to completion against a SHA nothing checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # WHY pinned to a commit SHA, not @main: a mutable branch ref lets the
    # remote workflow's behavior change under an already-merged pinax
    # commit. Refresh via:
    #   gh api repos/forkwright/.github/commits/main --jq '.sha'
    # and review the diff at forkwright/.github before bumping.
    uses: forkwright/.github/.github/workflows/gate-attestation.yml@df92942bcc41cc7ffd0339b75b2f01e52269d0ef # main
