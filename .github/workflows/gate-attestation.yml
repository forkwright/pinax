name: Gate Attestation

on:
  pull_request:
    branches: [main]

# WHY: the reusable declares `contents: read` for its own job, but the caller
# controls the token the reusable receives. Declaring it here keeps the grant
# explicit at the boundary that actually decides it.
permissions:
  contents: read

# WHY: the reusable declares no concurrency group, so without this a rapid
# re-push leaves the superseded run to completion against a SHA nothing checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call:
    # WHY @main, not pinned: the concern behind the old SHA pin was real -- a
    # mutable branch ref lets the remote workflow's behavior change under an
    # already-merged pinax commit with no local diff to review. But its
    # mitigation was the manual refresh procedure this comment used to cite,
    # and nobody ran it: forkwright/.github publishes no tags, so dependabot
    # never bumps this pin either, and the SHA just froze -- this file sat 10
    # days behind main. forkwright/.github is first-party -- same org, same
    # trust boundary -- not the third-party supply-chain case a SHA pin
    # defends against, and a floating ref can't go stale the way a
    # hand-refreshed one did.
    uses: forkwright/.github/.github/workflows/gate-attestation.yml@main
