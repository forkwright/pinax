name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# WHY: release-please must never race itself on rapid main pushes; queued
# runs are superseded, not cancelled, so an in-flight release finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# WHY: explicit grant of exactly what the shared workflow needs — release
# PR management, tag/release creation, and source-provenance attestation.
# Without this the reusable workflow call resolves with no jobs (fleet
# fault class: forkwright/epitelesis#1 hit the identical startup_failure).
permissions:
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  call:
    # WHY pinned to a commit SHA, not @main: a mutable branch ref lets the
    # remote workflow's behavior change under an already-merged pinax
    # commit. Refresh via:
    #   gh api repos/forkwright/.github/commits/main --jq '.sha'
    # and review the diff at forkwright/.github before bumping.
    uses: forkwright/.github/.github/workflows/release-please.yml@df92942bcc41cc7ffd0339b75b2f01e52269d0ef # main
