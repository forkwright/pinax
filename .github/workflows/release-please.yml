name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# WHY: release-please must never race itself on rapid main pushes; queued
# runs are superseded, not cancelled, so an in-flight release finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# WHY: explicit grant of exactly what the shared workflow needs — release
# PR management, tag/release creation, and source-provenance attestation.
# Without this the reusable workflow call resolves with no jobs (fleet
# fault class: forkwright/epitelesis#1 hit the identical startup_failure).
permissions:
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  call:
    # WHY @main, not pinned: the concern behind the old SHA pin was real -- a
    # mutable branch ref lets the remote workflow's behavior change under an
    # already-merged pinax commit with no local diff to review. But its
    # mitigation was the manual refresh procedure this comment used to cite,
    # and nobody ran it: forkwright/.github publishes no tags, so dependabot
    # never bumps this pin either, and the SHA just froze -- this file sat 10
    # days behind main. forkwright/.github is first-party -- same org, same
    # trust boundary -- not the third-party supply-chain case a SHA pin
    # defends against, and a floating ref can't go stale the way a
    # hand-refreshed one did.
    uses: forkwright/.github/.github/workflows/release-please.yml@main
